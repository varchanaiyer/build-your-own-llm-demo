# DigitalOcean App Platform spec for "Build Your Own LLM".
# Deploy with:  doctl apps create --spec .do/app.yaml
# (after pushing this repo to GitHub and setting the repo below)
name: build-your-own-llm
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_WITH/your-repo        # e.g. varchanaiyer/build-your-own-llm-demo
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb   # ~$5/mo; bump for faster training
    instance_count: 1
    health_check:
      http_path: /
    routes:
      - path: /
